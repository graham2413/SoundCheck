name: Deploy Frontend to S3

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 30 # need real commit history (not just the merge commit) to build release notes below

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      working-directory: ./frontend

    - name: Generate version info
      run: |
        mkdir -p ./frontend/public
        node ./scripts/build-version-json.js > ./frontend/public/version.json
      env:
        BUILD_VERSION: ${{ github.sha }}
        BUILD_NUMBER: ${{ github.run_number }}

    - name: Build Angular app
      run: npm run build -- --configuration production
      working-directory: ./frontend

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Clear S3 bucket
      run: aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }} --recursive

    - name: Upload to S3
      run: aws s3 sync ./frontend/dist/sound-check/browser s3://${{ secrets.S3_BUCKET_NAME }} --delete

    - name: Force-refresh PWA files that must never be stale
      run: |
        aws s3 cp ./frontend/dist/sound-check/browser/ngsw.json s3://${{ secrets.S3_BUCKET_NAME }}/ngsw.json \
          --content-type "application/json" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --metadata-directive REPLACE
        aws s3 cp ./frontend/dist/sound-check/browser/ngsw-worker.js s3://${{ secrets.S3_BUCKET_NAME }}/ngsw-worker.js \
          --content-type "application/javascript" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --metadata-directive REPLACE
        aws s3 cp ./frontend/dist/sound-check/browser/manifest.webmanifest s3://${{ secrets.S3_BUCKET_NAME }}/manifest.webmanifest \
          --content-type "application/manifest+json" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --metadata-directive REPLACE
        aws s3 cp ./frontend/dist/sound-check/browser/version.json s3://${{ secrets.S3_BUCKET_NAME }}/version.json \
          --content-type "application/json" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --metadata-directive REPLACE

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/index.html" "/ngsw.json" "/ngsw-worker.js" "/manifest.webmanifest" "/version.json"
