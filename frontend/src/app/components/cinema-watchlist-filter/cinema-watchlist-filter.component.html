<div class="fixed inset-0 z-30 flex justify-end bg-black/60" (click)="close()">
  <div
    class="w-full max-w-sm h-full overflow-y-auto p-5"
    style="background-color: #0b1120"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-semibold text-white">Sort</h2>
      <button type="button" (click)="close()" class="text-gray-400 hover:text-white text-2xl leading-none">
        &times;
      </button>
    </div>

    <!-- Sort By -->
    <div class="mb-5">
      <h3 class="text-sm font-semibold text-gray-300 mb-2">Sort By</h3>
      <div class="relative">
        <button
          type="button"
          (click)="toggleDropdown('sort')"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-gray-800/60 text-white border transition"
          [ngClass]="openDropdown === 'sort' ? 'border-[#0F5EE4] ring-2 ring-[#0F5EE4]/30' : 'border-gray-700'"
        >
          <span class="truncate">{{ sortLabel }}</span>
          <i class="fas fa-chevron-down text-gray-400 text-xs flex-shrink-0 ml-2" [ngClass]="openDropdown === 'sort' ? 'rotate-180' : ''"></i>
        </button>
        <div
          *ngIf="openDropdown === 'sort'"
          class="absolute z-20 mt-2 w-full rounded-xl border border-gray-700 shadow-2xl overflow-hidden"
          style="background-color: #111827"
        >
          <button
            *ngFor="let opt of sortOptions"
            type="button"
            (click)="setSortCombined(opt.value)"
            class="w-full text-left px-4 py-2.5 text-sm transition"
            [ngClass]="sortCombinedValue === opt.value ? 'bg-[#0F5EE4]/15 text-[#93c5fd] font-semibold' : 'text-gray-300 hover:bg-gray-800'"
          >
            {{ opt.label }}
          </button>
        </div>
      </div>
    </div>

    <hr class="border-gray-700 mb-5" />
    <h2 class="text-lg font-semibold text-white mb-4">Filter</h2>

    <!-- Release Status -->
    <div class="mb-5">
      <h3 class="text-sm font-semibold text-gray-300 mb-2">Release Status</h3>
      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          (click)="setReleaseStatus('all')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'all' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-layer-group"></i>
          All
        </button>
        <button
          type="button"
          (click)="setReleaseStatus('available')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'available' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-play-circle"></i>
          Available Now
        </button>
        <button
          type="button"
          (click)="setReleaseStatus('in_theaters')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'in_theaters' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-film"></i>
          In Theaters
        </button>
        <button
          type="button"
          (click)="setReleaseStatus('coming_soon')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'coming_soon' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-clock"></i>
          Coming Soon
        </button>
        <button
          type="button"
          (click)="setReleaseStatus('new_episodes')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'new_episodes' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-tv"></i>
          New Episodes
        </button>
        <button
          type="button"
          (click)="setReleaseStatus('back_in_theaters')"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition border"
          [ngClass]="draft.releaseStatus === 'back_in_theaters' ? 'bg-[#0F5EE4]/15 border-[#0F5EE4] text-[#93c5fd]' : 'bg-gray-800/50 border-gray-700 text-gray-400'"
        >
          <i class="fas fa-film"></i>
          Back in Theaters
        </button>
      </div>
    </div>

    <!-- Genres -->
    <div class="mb-5">
      <h3 class="text-sm font-semibold text-gray-300 mb-2">Genres</h3>
      <div class="relative">
        <button
          type="button"
          (click)="toggleDropdown('genre')"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-gray-800/60 text-white border transition"
          [ngClass]="openDropdown === 'genre' ? 'border-[#0F5EE4] ring-2 ring-[#0F5EE4]/30' : 'border-gray-700'"
        >
          <span class="truncate">{{ genreLabel }}</span>
          <i class="fas fa-chevron-down text-gray-400 text-xs flex-shrink-0 ml-2" [ngClass]="openDropdown === 'genre' ? 'rotate-180' : ''"></i>
        </button>
        <div
          *ngIf="openDropdown === 'genre'"
          class="absolute z-20 mt-2 w-full max-h-60 overflow-y-auto rounded-xl border border-gray-700 shadow-2xl"
          style="background-color: #111827"
        >
          <button
            type="button"
            (click)="selectGenre('')"
            class="w-full text-left px-4 py-2.5 text-sm transition"
            [ngClass]="draft.genre === '' ? 'bg-[#0F5EE4]/15 text-[#93c5fd] font-semibold' : 'text-gray-300 hover:bg-gray-800'"
          >
            All Genres
          </button>
          <button
            *ngFor="let g of genres"
            type="button"
            (click)="selectGenre(g)"
            class="w-full text-left px-4 py-2.5 text-sm transition"
            [ngClass]="draft.genre === g ? 'bg-[#0F5EE4]/15 text-[#93c5fd] font-semibold' : 'text-gray-300 hover:bg-gray-800'"
          >
            {{ g }}
          </button>
        </div>
      </div>
    </div>

    <!-- Availability -->
    <div class="mb-5">
      <h3 class="text-sm font-semibold text-gray-300 mb-2">Availability</h3>
      <div class="relative">
        <button
          type="button"
          (click)="toggleDropdown('provider')"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-gray-800/60 text-white border transition"
          [ngClass]="openDropdown === 'provider' ? 'border-[#0F5EE4] ring-2 ring-[#0F5EE4]/30' : 'border-gray-700'"
        >
          <span class="truncate">{{ providerLabel }}</span>
          <i class="fas fa-chevron-down text-gray-400 text-xs flex-shrink-0 ml-2" [ngClass]="openDropdown === 'provider' ? 'rotate-180' : ''"></i>
        </button>
        <div
          *ngIf="openDropdown === 'provider'"
          class="absolute z-20 mt-2 w-full max-h-60 overflow-y-auto rounded-xl border border-gray-700 shadow-2xl"
          style="background-color: #111827"
        >
          <button
            type="button"
            (click)="selectProvider('')"
            class="w-full text-left px-4 py-2.5 text-sm transition"
            [ngClass]="draft.provider === '' ? 'bg-[#0F5EE4]/15 text-[#93c5fd] font-semibold' : 'text-gray-300 hover:bg-gray-800'"
          >
            All Providers
          </button>
          <button
            *ngFor="let p of providers"
            type="button"
            (click)="selectProvider(p)"
            class="w-full text-left px-4 py-2.5 text-sm transition"
            [ngClass]="draft.provider === p ? 'bg-[#0F5EE4]/15 text-[#93c5fd] font-semibold' : 'text-gray-300 hover:bg-gray-800'"
          >
            {{ p }}
          </button>
        </div>
      </div>
    </div>

    <!-- Toggles -->
    <div class="mb-6 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-white text-sm font-medium">Show Only My Rated Items</p>
          <p class="text-gray-500 text-xs">Items you've already rated or reviewed</p>
        </div>
        <button
          type="button"
          role="switch"
          [attr.aria-checked]="draft.hasRatingOnly"
          (click)="draft.hasRatingOnly = !draft.hasRatingOnly"
          class="w-11 h-6 rounded-full transition flex-shrink-0 relative"
          [ngClass]="draft.hasRatingOnly ? 'bg-[#0F5EE4]' : 'bg-gray-700'"
        >
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white transition-transform"
            [ngClass]="draft.hasRatingOnly ? 'translate-x-5' : ''"
          ></span>
        </button>
      </div>

      <div class="flex items-center justify-between">
        <div>
          <p class="text-white text-sm font-medium">Show Only Items with a Release Date</p>
          <p class="text-gray-500 text-xs">Hide items without a confirmed date</p>
        </div>
        <button
          type="button"
          role="switch"
          [attr.aria-checked]="draft.hasReleaseDateOnly"
          (click)="draft.hasReleaseDateOnly = !draft.hasReleaseDateOnly"
          class="w-11 h-6 rounded-full transition flex-shrink-0 relative"
          [ngClass]="draft.hasReleaseDateOnly ? 'bg-[#0F5EE4]' : 'bg-gray-700'"
        >
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white transition-transform"
            [ngClass]="draft.hasReleaseDateOnly ? 'translate-x-5' : ''"
          ></span>
        </button>
      </div>

      <div class="flex items-center justify-between">
        <div>
          <p class="text-white text-sm font-medium">Group by Release Status</p>
          <p class="text-gray-500 text-xs">Organize into Available Now / In Theaters / Coming Soon</p>
        </div>
        <button
          type="button"
          role="switch"
          [attr.aria-checked]="draft.groupByReleaseStatus"
          (click)="draft.groupByReleaseStatus = !draft.groupByReleaseStatus"
          class="w-11 h-6 rounded-full transition flex-shrink-0 relative"
          [ngClass]="draft.groupByReleaseStatus ? 'bg-[#0F5EE4]' : 'bg-gray-700'"
        >
          <span
            class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white transition-transform"
            [ngClass]="draft.groupByReleaseStatus ? 'translate-x-5' : ''"
          ></span>
        </button>
      </div>
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        (click)="reset()"
        class="flex-1 px-4 py-2 rounded-lg border border-gray-700 text-gray-300 font-semibold hover:bg-gray-800 transition"
      >
        Reset
      </button>
      <button
        type="button"
        (click)="applyFilters()"
        class="flex-1 px-4 py-2 rounded-lg bg-[#0F5EE4] text-white font-semibold hover:bg-blue-600 transition"
      >
        Apply Filters
      </button>
    </div>
  </div>
</div>
