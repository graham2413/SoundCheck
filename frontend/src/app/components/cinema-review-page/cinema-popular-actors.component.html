<div class="fixed inset-0 z-50 overflow-y-auto bg-[#020814] pb-8">
  <div class="relative flex items-center px-4 pt-4">
    <button
      type="button"
      aria-label="Back"
      (click)="back.emit()"
      class="w-11 h-11 rounded-full border border-gray-600 text-gray-200 flex items-center justify-center text-lg flex-shrink-0"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="absolute left-1/2 -translate-x-1/2 text-white font-bold text-xl">Top 50 Actors</h1>
  </div>

  <div class="cinema-loader-overlay" *ngIf="isLoading">
    <div class="cinema-loader-ring"></div>
    <p class="cinema-loader-text">Loading rankings…</p>
  </div>

  <div class="flex flex-col px-4 mt-3" *ngIf="!isLoading">
    <div
      class="flex items-center gap-3 py-3 border-b border-gray-800 last:border-b-0"
      *ngFor="let actor of actors; let i = index"
    >
      <span class="text-gray-500 font-bold text-sm w-6 text-center flex-shrink-0">{{ i + 1 }}</span>
      <div class="aspect-[2/3] w-12 flex-shrink-0">
        <img
          *ngIf="actor.profilePath"
          [src]="actor.profilePath"
          [alt]="actor.name"
          loading="lazy"
          class="h-full w-full object-cover rounded-lg"
        />
        <div *ngIf="!actor.profilePath" class="h-full w-full rounded-lg bg-gray-800 flex items-center justify-center">
          <i class="fas fa-user text-gray-600"></i>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-white font-semibold truncate">{{ actor.name }}</p>
        <p class="text-gray-400 text-sm truncate" *ngIf="actor.knownForTitle">
          Known for {{ actor.knownForTitle }}
        </p>
      </div>
      <div class="text-right flex-shrink-0">
        <p class="text-[#3B82F6] font-bold text-base">
          {{ actor.popularity | number : '1.0-0' }}
        </p>
        <p class="text-gray-500 text-xs">{{ actor.isEstimated ? 'est. views' : 'views/mo' }}</p>
      </div>
    </div>
  </div>
</div>
