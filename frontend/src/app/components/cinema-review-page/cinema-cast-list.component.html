<div class="pb-8">
  <div class="relative flex items-center px-4 pt-4">
    <button
      type="button"
      aria-label="Back"
      (click)="back.emit()"
      class="w-11 h-11 rounded-full border border-gray-600 text-gray-200 flex items-center justify-center text-lg flex-shrink-0"
    >
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="absolute left-1/2 -translate-x-1/2 text-white font-bold text-xl">Cast</h1>
    <div class="ml-auto flex items-center gap-2">
      <button
        type="button"
        aria-label="Search"
        (click)="toggleSearch()"
        class="w-11 h-11 rounded-full border border-gray-600 text-gray-200 flex items-center justify-center flex-shrink-0"
      >
        <i class="fas fa-search"></i>
      </button>
      <div class="relative flex-shrink-0">
        <button
          type="button"
          aria-label="Sort"
          (click)="showSortMenu = !showSortMenu"
          class="w-11 h-11 rounded-full border border-gray-600 text-gray-200 flex items-center justify-center"
        >
          <i class="fas fa-sliders-h"></i>
        </button>
        <div
          *ngIf="showSortMenu"
          class="absolute right-0 mt-2 w-44 rounded-lg border border-gray-700 bg-[#0b1120] z-10 overflow-hidden"
        >
          <button
            type="button"
            *ngFor="let option of sortOptions"
            (click)="setSortBy(option)"
            class="w-full text-left px-4 py-2 text-sm hover:bg-gray-800"
            [ngClass]="sortBy === option ? 'text-[#0F5EE4] font-semibold' : 'text-gray-200'"
          >
            {{ sortLabels[option] }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="px-4 mt-3" *ngIf="showSearch">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search cast..."
      class="w-full px-4 py-2 rounded-full bg-gray-800 text-white placeholder-gray-500 border border-gray-700 focus:outline-none focus:border-[#0F5EE4]"
    />
  </div>

  <p class="text-gray-400 text-sm px-4 mt-4">
    {{ filteredSortedCast.length }} cast member{{ filteredSortedCast.length === 1 ? '' : 's' }}
  </p>

  <div class="flex flex-col px-4 mt-3">
    <div
      class="flex items-center gap-3 py-3 border-b border-gray-800 last:border-b-0 cursor-pointer"
      *ngFor="let member of filteredSortedCast"
      (click)="selectedMember = member"
    >
      <div class="aspect-[2/3] w-14 flex-shrink-0">
        <img
          *ngIf="member.profilePath"
          [src]="member.profilePath"
          [alt]="member.name"
          class="h-full w-full object-cover rounded-lg"
        />
        <div
          *ngIf="!member.profilePath"
          class="h-full w-full rounded-lg bg-gray-800 flex items-center justify-center"
        >
          <i class="fas fa-user text-gray-600"></i>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-white font-semibold truncate">{{ member.name }}</p>
        <p class="text-gray-400 text-sm truncate">{{ member.character }}</p>
      </div>
      <button
        type="button"
        *ngIf="member.popularity != null"
        (click)="$event.stopPropagation(); showPopularActors = true"
        class="flex flex-col items-center justify-center px-3 py-2 rounded-lg bg-gray-800 flex-shrink-0"
      >
        <span class="text-[#3B82F6] font-bold text-lg leading-none">{{ member.popularity | number : '1.1-1' }}</span>
        <span class="text-gray-500 text-[10px] mt-0.5">Rating</span>
      </button>
    </div>
  </div>
</div>

<app-cinema-popular-actors
  *ngIf="showPopularActors"
  (back)="showPopularActors = false"
></app-cinema-popular-actors>

<app-cinema-person-detail
  *ngIf="selectedMember"
  [personId]="selectedMember.personId ?? null"
  [fallbackName]="selectedMember.name"
  [fallbackCharacter]="selectedMember.character"
  [fallbackProfilePath]="selectedMember.profilePath"
  (close)="selectedMember = null"
></app-cinema-person-detail>
