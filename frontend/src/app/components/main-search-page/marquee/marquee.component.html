<div class="bg-[#020814] text-white pb-[6rem] md:pb-8 md:pt-[0.5rem]">
  <!-- Marquee Container -->
  <div class="marquee-container">
    <div
      class="marquee-track"
      *ngIf="!isMarqueeLoading; else loading"
      @fadeSlideIn
      (mouseenter)="setPointerOver(true)"
      (mouseleave)="setPointerOver(false)"
      (touchstart)="setPointerOver(true)"
      (touchend)="setPointerOver(false)"
    >
      <ng-container *ngFor="let album of loopedAlbums; let i = index; trackBy: trackByIndex">
        <div
          class="album-card relative w-[9.5rem] md:w-[13.5rem] h-[9.5rem] md:h-[13.5rem] rounded-lg overflow-hidden"
          @itemAnim
          (click)="onCardClick(album, i)"
        >
          <!-- Loader -->
          <div
            *ngIf="!marqueeImageLoaded[i]"
            class="absolute inset-0 flex items-center justify-center bg-gray-800"
          >
            <div
              class="w-5 h-5 border-t-2 border-white rounded-full animate-spin"
            ></div>
          </div>

          <!-- Image -->
          <img
            [src]="
              album.cover ||
              'https://res.cloudinary.com/drbccjuul/image/upload/e_improve:outdoor/m2bmgchypxctuwaac801'
            "
            [alt]="album.title"
            decoding="async"
            (load)="onImageLoaded(i)"
            (error)="onImageLoaded(i)"
            [class.invisible]="!marqueeImageLoaded[i % albums.length]"
            class="w-full h-full object-cover"
          />

          <!-- Song/Album/EP + release date badge -->
          <span
            class="absolute top-2 right-2 bg-black/70 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded"
          >
            <span class="uppercase">{{ album?.releaseType || 'Album' }}</span
            ><ng-container *ngIf="album?.releaseDate">
              &nbsp;&middot; {{ getShortTimeAgo(album.releaseDate) }}
            </ng-container>
          </span>

          <!-- Bottom gradient fade -->
          <div
            class="absolute bottom-0 left-0 right-0 h-1/2 bg-gradient-to-t from-black via-black/70 to-transparent pointer-events-none"
          ></div>

          <!-- Title / artist overlay -->
          <div class="absolute bottom-0 left-0 right-0 p-3 overflow-hidden">
            <p
              class="title text-base md:text-lg truncate w-full text-left font-semibold text-white"
              [title]="album.title"
            >
              {{ album.title }}
            </p>
            <p
              class="artist text-sm md:text-base text-gray-300 truncate w-full text-left"
              [title]="album.artist"
            >
              <span
                *ngIf="album?.isExplicit"
                class="inline-flex items-center justify-center bg-gray-600 text-white text-[12px] font-bold w-5 h-5 px-[1px] rounded leading-none mr-1 whitespace-nowrap align-middle"
                title="Explicit"
              >
                E
              </span>
              {{ album.artist }}
            </p>
          </div>
        </div>
      </ng-container>
    </div>

    <ng-template #loading>
      <div class="marquee-track">
        <div
          *ngFor="let _ of skeletonArray"
          class="skeleton-card bg-[#1F2937] p-3 rounded-lg h-[12.7rem] md:h-[17.2rem] w-[9.5rem] md:w-[13.5rem] shrink-0"
        >
          <div class="skeleton-img"></div>
          <div class="skeleton-text-group w-full flex flex-col items-start">
            <div class="skeleton-text mt-3 h-4 w-3/4"></div>
            <div class="skeleton-text mt-2 h-4 w-1/2"></div>
          </div>
        </div>
      </div>
    </ng-template>
  </div>
</div>
