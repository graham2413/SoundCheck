<nav
  class="hidden md:flex bg-[#020814] bg-opacity-50 backdrop-blur-lg text-white px-6 py-3 flex items-center justify-between fixed w-full top-0 left-0 z-50 h-[4.5rem] border-b border-b-gray-700"
  (click)="closeProfileMenuOnOutsideClick($event)"
>
  <div class="flex items-center gap-1">
    <div class="h-[3.5rem] w-[3.5rem] relative">
      <img
        src="../assets/scLogo.png?v=2"
        alt="Logo"
        class="absolute inset-0 h-full w-full object-contain"
        routerLink="/"
      />
    </div>
    <span
      routerLink="/"
      class="cursor-pointer text-2xl font-extrabold tracking-tight bg-gradient-to-b from-gray-100 via-gray-300 to-gray-500 bg-clip-text text-transparent drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]"
    >
      Sound &amp; Screen
    </span>
  </div>

  <div class="hidden md:flex items-center gap-4 relative">
    <div
      class="relative"
      (mouseenter)="isProfileMenuOpen = true"
      (mouseleave)="isProfileMenuOpen = false"
    >
      <button
        (click)="toggleProfileMenu($event)"
        class="flex items-center rounded-full focus:outline-none"
      >
        <div class="h-[4rem] w-[4rem] relative">
          <!-- Skeleton Loader (When Loading) -->
          <div
            *ngIf="isProfileLoading"
            class="absolute inset-0 flex items-center justify-center h-full w-full rounded-full border-2 border-gray-700 bg-gray-800"
          >
            <div
              class="w-6 h-6 border-t-2 border-white rounded-full animate-spin"
            ></div>
          </div>

          <!-- Profile Icon -->
          <img
            *ngIf="!isProfileLoading && userProfile?.profilePicture"
            [src]="getTransformedImageUrl(userProfile.profilePicture)"
            alt="Profile Picture"
            class="absolute inset-0 h-full w-full object-cover rounded-full border-2 border-gray-700"
          />
          <i
            *ngIf="!isProfileLoading && !userProfile?.profilePicture"
            class="fas fa-user-circle absolute inset-0 text-white text-4xl flex items-center justify-center"
          ></i>
        </div>
      </button>

      <div
        *ngIf="isProfileMenuOpen"
        @fadeScale
        class="absolute font-semibold right-0 mt-2 w-56 bg-[#020814] text-gray-300 rounded-lg shadow-lg z-50 border border-gray-700"
      >
<a
  routerLink="/"
  (click)="closeProfileMenu()"
  class="group flex items-center px-4 py-3 text-base hover:text-white transition-all duration-200"
>
  <i
    class="fas fa-home w-5 text-center translate-y-[3px] text-base transform transition-all duration-200 ease-out scale-100 text-gray-100 opacity-50 group-hover:scale-110 group-hover:ml-2 group-hover:text-white group-hover:opacity-100 group-hover:translate-y-0"
  ></i>
  <span
    class="ml-3 translate-y-[3px] text-gray-100 opacity-50 transition-all duration-200 group-hover:translate-y-0 group-hover:ml-4 group-hover:text-white group-hover:opacity-100"
  >
    Home
  </span>
</a>

        <a
          [routerLink]="['/profile', userProfile._id]"
          (click)="closeProfileMenu()"
          class="group flex items-center px-4 py-3 text-base hover:text-white transition-all duration-200"
        >
<i
  class="fas fa-user w-5 text-center translate-y-[3px] group-hover:translate-y-0 text-base transform transition-all duration-200 ease-out scale-100 text-gray-100 opacity-50 group-hover:scale-110 group-hover:ml-2 group-hover:text-white group-hover:opacity-100"
></i>
<span
  class="ml-3 translate-y-[3px] text-gray-100 opacity-50 transition-all duration-200 group-hover:translate-y-0 group-hover:ml-4 group-hover:text-white group-hover:opacity-100"
>
  Profile
</span>

        </a>

<a
  routerLink="/calendar"
  (click)="closeProfileMenu()"
  class="group flex items-center px-4 py-3 text-base hover:text-white transition-all duration-200"
>
  <i
    class="fas fa-calendar-alt w-5 text-center translate-y-[3px] text-base transform transition-all duration-200 ease-out scale-100 text-gray-100 opacity-50 group-hover:scale-110 group-hover:ml-2 group-hover:text-white group-hover:opacity-100 group-hover:translate-y-0"
  ></i>
  <span
    class="ml-3 translate-y-[3px] text-gray-100 opacity-50 transition-all duration-200 group-hover:translate-y-0 group-hover:ml-4 group-hover:text-white group-hover:opacity-100"
  >
    Calendar
  </span>
</a>

<a
  routerLink="/friends"
  (click)="closeProfileMenu()"
  class="group flex items-center px-4 py-3 text-base hover:text-white transition-all duration-200"
>
  <i
    class="fas fa-users w-5 text-center translate-y-[3px] text-base transform transition-all duration-200 ease-out scale-100 text-gray-100 opacity-50 group-hover:scale-110 group-hover:ml-2 group-hover:text-white group-hover:opacity-100 group-hover:translate-y-0"
  ></i>
  <span
    class="ml-3 translate-y-[3px] text-gray-100 opacity-50 transition-all duration-200 group-hover:translate-y-0 group-hover:ml-4 group-hover:text-white group-hover:opacity-100"
  >
    Friends
  </span>
</a>


<button
  (click)="logout()"
  class="group flex items-center w-full text-left px-4 py-3 text-base text-red-300 hover:text-red-500 transition-all duration-200"
>
  <i
    class="fas fa-sign-out-alt w-5 text-center translate-y-[3px] text-base transform transition-all duration-200 ease-out scale-100 opacity-75 group-hover:scale-110 group-hover:ml-2 group-hover:opacity-100 group-hover:translate-y-0 group-hover:text-red-500"
  ></i>
  <span
    class="ml-3 translate-y-[3px] opacity-75 transition-all duration-200 group-hover:translate-y-0 group-hover:ml-4 group-hover:opacity-100 group-hover:text-red-500"
  >
    Logout
  </span>
</button>

      </div>
    </div>
  </div>

  <button (click)="toggleMenu()" class="md:hidden">
    <svg
      class="h-8 w-8 text-white"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M4 6h16M4 12h16m-7 6h7"></path>
    </svg>
  </button>
</nav>
<div
  *ngIf="isMenuOpen"
  @fadeSlide
  class="fixed inset-0 bg-[#020814]/90 backdrop-blur-lg flex flex-col items-center text-white md:hidden z-50 h-full py-10"
>
  <!-- Close Button -->
  <button
    (click)="toggleMenu()"
    class="absolute top-6 right-6 text-6xl text-gray-300 hover:text-white transition"
  >
    &times;
  </button>

  <!-- Navigation Links Wrapper -->
  <div
    class="flex flex-col items-center justify-center flex-1 w-full space-y-[5rem]"
  >
    <a
      routerLink="/"
      (click)="toggleMenu()"
      class="flex items-center gap-3 text-4xl font-semibold text-gray-300 hover:text-white transition"
    >
      <i class="fas fa-search"></i> Discover
    </a>

    <a
      routerLink="/friends"
      (click)="toggleMenu()"
      class="flex items-center gap-3 text-4xl font-semibold text-gray-300 hover:text-white transition"
    >
      <i class="fas fa-users"></i> Friends
    </a>

    <a
      routerLink="/calendar"
      (click)="toggleMenu()"
      class="flex items-center gap-3 text-4xl font-semibold text-gray-300 hover:text-white transition"
    >
      <i class="fas fa-calendar-alt"></i> Calendar
    </a>

    <a
      routerLink="/profile"
      (click)="toggleMenu()"
      class="flex items-center gap-3 text-4xl font-semibold text-gray-300 hover:text-white transition"
    >
      <i class="fas fa-user"></i> Profile
    </a>
  </div>

  <!-- Logout Button -->
  <button
    (click)="logout()"
    class="flex items-center gap-3 bg-red-500 px-8 py-4 rounded-lg text-2xl font-semibold text-white hover:brightness-110 transition shadow-md mb-10"
  >
    <i class="fas fa-sign-out-alt"></i> Logout
  </button>
</div>

<!-- Bottom Navigation for Mobile -->
<div
  (click)="expandMobileNav()"
  [ngClass]="isMobileNavShrunk ? 'h-[3.4rem] left-10 right-10' : 'h-[4rem] left-5 right-5'"
  class="bg-[#020814] shadow-lg flex md:hidden fixed bottom-4 z-20 justify-around items-center rounded-full border border-gray-800 transition-all duration-300 ease-in-out"
>
  <!-- Sliding highlight capsule -->
  <div
    class="absolute inset-y-0 z-0 flex items-center justify-center pointer-events-none transition-all duration-300 ease-in-out"
    [ngStyle]="{ left: getActiveMobileNavIndex() * 25 + '%', width: '25%' }"
  >
    <div class="h-[3.3rem] w-[5rem] rounded-full bg-[#1F2937]"></div>
  </div>

  <button
    routerLink="/"
    (click)="setActiveTab('home')"
    class="relative z-10 flex items-center justify-center h-full flex-1"
  >
    <span
      class="text-[2rem] transition-all duration-200 ease-out"
      [ngClass]="
        activeTab === 'home'
          ? 'material-icons text-white'
          : 'material-icons-outlined text-gray-100 opacity-50'
      "
      >home</span
    >
  </button>

  <button
    routerLink="/calendar"
    (click)="setActiveTab('calendar')"
    class="relative z-10 flex items-center justify-center h-full flex-1"
  >
    <span
      class="text-[1.75rem] transition-all duration-200 ease-out"
      [ngClass]="
        activeTab === 'calendar'
          ? 'material-icons text-white'
          : 'material-icons-outlined text-gray-100 opacity-50'
      "
      >calendar_today</span
    >
  </button>

  <button
    routerLink="/friends"
    (click)="setActiveTab('friends')"
    class="relative z-10 flex items-center justify-center h-full flex-1"
  >
    <span class="relative flex items-center justify-center">
      <span
        class="text-[2.1rem] transition-all duration-200 ease-out"
        [ngClass]="
          activeTab === 'friends'
            ? 'material-icons text-white'
            : 'material-icons-outlined text-gray-100 opacity-50'
        "
        >people</span
      >

      <span
        *ngIf="userProfile.friendInfo.friendRequestsReceived?.length"
        class="absolute -top-1 -right-2 bg-red-500 text-white text-[0.8rem] font-bold px-[5px] py-[1px] rounded-full leading-none flex items-center justify-center w-[1.3rem] h-[1.3rem]"
      >
        {{ userProfile.friendInfo.friendRequestsReceived.length }}
      </span>
    </span>
  </button>

  <button
    [routerLink]="['/profile', userProfile._id]"
    (click)="setActiveTab('profile')"
    class="relative z-10 flex items-center justify-center h-full flex-1"
  >
    <span
      class="text-[2.2rem] transition-all duration-200 ease-out"
      [ngClass]="
        activeTab === 'profile'
          ? 'material-icons text-white'
          : 'material-icons-outlined text-gray-100 opacity-50'
      "
      >account_circle</span
    >
  </button>
</div>
