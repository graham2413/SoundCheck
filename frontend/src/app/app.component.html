<app-navbar *ngIf="shouldShowNavbar()"></app-navbar>

<!-- Blocking forced-update overlay - no dismiss, only way through is Update Now -->
<div
  *ngIf="updateAvailable"
  class="fixed inset-0 z-[9999] bg-[#020814] text-white flex flex-col items-center px-6 pt-16 pb-10 overflow-y-auto"
>
  <div class="w-full max-w-sm mx-auto flex flex-col items-center">
    <div class="relative h-40 w-40 flex items-center justify-center mb-8">
      <div class="absolute h-28 w-28 rounded-full bg-blue-300/40 blur-sm"></div>
      <div class="relative h-28 w-28 rounded-full bg-[#020814] border border-blue-500/70 shadow-[0_0_6px_1px_rgba(59,130,246,0.5)] flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-14 h-14 text-blue-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </div>
    </div>

    <h1 class="text-3xl font-extrabold text-center mb-3">
      Update <span class="text-blue-500">Required</span>
    </h1>
    <p class="text-gray-400 text-center mb-6">
      A new version of <span class="text-blue-500">{{ title }}</span> is available. Update now to keep enjoying the best experience.
    </p>

    <div *ngIf="updateBuildNumber" class="flex items-center gap-2 px-4 py-2 rounded-full border border-blue-500/30 bg-blue-600/10 mb-8">
      <i class="fas fa-tag text-blue-500 text-sm"></i>
      <span class="font-semibold text-sm">Version {{ updateBuildNumber }}</span>
      <span class="text-blue-400 text-sm">(Latest)</span>
    </div>

    <div class="w-full flex flex-col divide-y divide-gray-800 mb-8">
      <div
        *ngFor="let section of updateNotes | keyvalue"
        class="flex items-start gap-4 py-4"
      >
        <div class="h-10 w-10 rounded-xl bg-blue-600/10 flex items-center justify-center flex-shrink-0" [ngSwitch]="updateNoteIcons[section.key]">
          <svg *ngSwitchCase="'star'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-blue-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
          </svg>
          <svg *ngSwitchCase="'shield'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-blue-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M12 3c-2.598 1.943-5.812 3.03-9 3.09v6.093c0 3.917 2.617 7.39 6.293 8.535a1.34 1.34 0 0 0 .707.09 1.34 1.34 0 0 0 .707-.09C15.383 19.573 18 16.099 18 12.183V6.09c-3.188-.06-6.402-1.147-9-3.09Z" />
          </svg>
          <svg *ngSwitchCase="'lock'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-blue-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
          <i *ngSwitchDefault class="far fa-circle-check text-blue-500"></i>
        </div>
        <div>
          <p class="font-semibold">{{ section.key }}</p>
          <p *ngFor="let item of section.value" class="text-gray-400 text-sm">{{ item }}</p>
        </div>
      </div>
    </div>

    <button
      (click)="applyUpdate()"
      [disabled]="isApplyingUpdate"
      class="w-full py-4 rounded-full bg-blue-600 hover:bg-blue-500 transition font-semibold text-lg flex items-center justify-center gap-2 disabled:opacity-60"
    >
      <i class="fas fa-download"></i>
      {{ isApplyingUpdate ? 'Updating...' : 'Update Now' }}
    </button>
  </div>
</div>

<!-- Animation wrapper -->
<main [@routeAnimations]="prepareRoute(activeOutlet)">
  <!-- Loader fallback -->
  <div
    *ngIf="!profileLoaded"
    class="full-screen-loader fixed inset-0 flex items-center justify-center text-white"
  >
    <div class="background-underlay"></div>
    <div class="blur-overlay">
      <div class="equalizer-loader">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
        <span class="bar bar4"></span>
        <span class="bar bar5"></span>
      </div>
    </div>
  </div>

  <!-- Routed content -->
  <ng-container *ngIf="profileLoaded">
    <router-outlet #outlet="outlet" (activate)="setActiveOutlet(outlet)"></router-outlet>
  </ng-container>
</main>
