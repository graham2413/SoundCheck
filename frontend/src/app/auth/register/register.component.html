<div
  class="flex min-h-screen flex-col justify-start px-2 lg:px-8 bg-[#020814] text-white mt-[1rem] [@media(max-height:820px)]:mt-2"
>
<div class="sm:mx-auto text-center">
  <div class="relative inline-block">
    <div class="absolute inset-0 m-auto h-24 w-24 rounded-full bg-blue-500/40 blur-xl"></div>

    <!-- Soundwave bars flanking the logo, tapering + rippling outward -->
    <!-- top-[55%] aligns with the flat line drawn inside the logo artwork itself, not the box's true 50% center -->
    <div
      class="absolute -inset-x-[100vw] top-[53.5%] -translate-y-1/2 flex items-center justify-center gap-[3px] pointer-events-none z-0"
      style="mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);"
    >
      <div class="flex items-center gap-[3px]" style="transform: scaleX(-1)">
        <div
          *ngFor="let bar of waveformBars"
          class="w-[3px] rounded-full"
          [style.height.px]="bar.height"
          [style.opacity]="bar.opacity"
          style="background: linear-gradient(to top, #6b7280, #f1f5f9);"
        ></div>
      </div>
      <div class="w-24 flex-shrink-0"></div>
      <div class="flex items-center gap-[3px]">
        <div
          *ngFor="let bar of waveformBars"
          class="w-[3px] rounded-full"
          [style.height.px]="bar.height"
          [style.opacity]="bar.opacity"
          style="background: linear-gradient(to top, #6b7280, #f1f5f9);"
        ></div>
      </div>
    </div>

    <img
      class="relative z-10 h-auto w-40 mx-auto logoQuery object-contain"
      src="../assets/scLogo.png?v=2"
      alt="Sound Check Logo"
    />
  </div>
</div>

<div class="text-center mb-3 -mt-3 [@media(max-height:820px)]:mb-1">
  <h1
    class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-b from-gray-100 via-gray-300 to-gray-500 bg-clip-text text-transparent drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]"
  >
    Cinewave
  </h1>
  <p class="text-indigo-400 text-xs md:text-sm font-semibold uppercase tracking-widest mt-1">Audio-Visual Discovery &amp; Reviews</p>
</div>

<div class="space-y-1 mt-4 [@media(max-height:820px)]:mt-2">
  <h2
    class="text-2xl font-extrabold tracking-tight text-center bg-gradient-to-b from-gray-100 via-gray-300 to-gray-500 bg-clip-text text-transparent drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]"
  >
    Create Account
  </h2>
</div>

  <div
    class="sm:mx-auto sm:w-full sm:max-w-xl bg-[#11192B] mt-2 p-4 md:p-6 [@media(max-height:820px)]:p-3 rounded-lg shadow-md border border-gray-700/60"
  >
    <form class="space-y-4 [@media(max-height:820px)]:space-y-2">
      <!-- Full Name -->
      <div>
        <label class="block text-gray-300 text-base md:text-lg font-semibold mb-1 [@media(max-height:820px)]:mb-0.5"
          >Full Name</label
        >
        <div class="relative">
          <i class="far fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          <input
            type="text"
            [(ngModel)]="username"
            name="fullName"
            placeholder="Enter your full name"
            class="w-full pl-10 pr-4 py-2 [@media(max-height:820px)]:py-1 rounded-md text-white placeholder-gray-500 border border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base md:text-lg"
          />
        </div>
        <p *ngIf="errorMessages.username" class="text-red-500 text-base md:text-lg mt-1">
          {{ errorMessages.username }}
        </p>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-gray-300 text-base md:text-lg font-semibold mb-1 [@media(max-height:820px)]:mb-0.5"
          >Email</label
        >
        <div class="relative">
          <i class="far fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Enter your email"
            class="w-full pl-10 pr-4 py-2 [@media(max-height:820px)]:py-1 rounded-md text-white placeholder-gray-500 border border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base md:text-lg"
          />
        </div>
        <p *ngIf="errorMessages.email" class="text-red-500 text-base md:text-lg mt-1">
          {{ errorMessages.email }}
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-gray-300 text-base md:text-lg font-semibold mb-1 [@media(max-height:820px)]:mb-0.5"
          >Password</label
        >
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter your password"
        class="w-full pl-10 pr-4 py-2 [@media(max-height:820px)]:py-1 rounded-md text-white placeholder-gray-500 border border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base md:text-lg"
        autocomplete="new-password"
          />
          <i
        [ngClass]="[
          showPassword ? 'fa-eye-slash' : 'fa-eye',
          'far absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-200'
        ]"
        (click)="showPassword = !showPassword"
          ></i>
        </div>
        <p *ngIf="errorMessages.password" class="text-red-500 text-base md:text-lg mt-1">
          {{ errorMessages.password }}
        </p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-gray-300 text-base md:text-lg font-semibold mb-1 [@media(max-height:820px)]:mb-0.5"
          >Confirm Password</label
        >
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        class="w-full pl-10 pr-4 py-2 [@media(max-height:820px)]:py-1 rounded-md text-white placeholder-gray-500 border border-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base md:text-lg"
        autocomplete="new-password"
          />
          <i
        [ngClass]="[
          showConfirmPassword ? 'fa-eye-slash' : 'fa-eye',
          'far absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-200'
        ]"
        (click)="showConfirmPassword = !showConfirmPassword"
          ></i>
        </div>
        <p
          *ngIf="errorMessages.confirmPassword"
          class="text-red-500 text-base md:text-lg mt-1"
        >
          {{ errorMessages.confirmPassword }}
        </p>
      </div>

      <!-- Register Button with Loading Indicator -->
      <div class="[@media(max-height:820px)]:pt-2">
        <button
          (click)="onSubmit()"
          [disabled]="isLoading"
          class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:brightness-110 text-white px-4 py-2 rounded-md font-semibold transition flex justify-center items-center"
        >
          <span *ngIf="!isLoading">Sign Up</span>
          <span
            *ngIf="isLoading"
            class="animate-spin h-5 w-5 border-4 border-white border-t-transparent rounded-full"
          ></span>
        </button>
      </div>
    </form>

    <!-- Divider -->
    <div class="mt-4 flex items-center text-gray-500 registerMargin">
      <hr class="flex-grow border-gray-600" />
      <span class="px-2">OR</span>
      <hr class="flex-grow border-gray-600" />
    </div>

    <!-- Google Sign Up -->
    <div class="mt-4 registerMargin">
      <button
        (click)="loginWithGoogle()"
        [disabled]="isGoogleLoading"
        class="w-full flex items-center justify-center gap-2 bg-[#060C1F] hover:bg-[#0a1330] px-4 py-2 rounded-md text-white font-medium border border-gray-300/30 transition"
      >
        <img
          src="../assets/google.png"
          class="h-5 w-5"
          *ngIf="!isGoogleLoading"
        />
        <div *ngIf="isGoogleLoading" class="google-loader"></div>
        <span *ngIf="!isGoogleLoading">Continue with Google</span>
        <span *ngIf="isGoogleLoading">Redirecting...</span>
      </button>
    </div>
  </div>
      <!-- Already Have an Account -->
      <p class="text-center text-base md:text-lg text-gray-400 my-4 [@media(max-height:820px)]:my-2">
        Already have an account?
        <a [routerLink]="['/login']" class="text-indigo-400 hover:underline"
          >Sign in</a
        >
      </p>
</div>
